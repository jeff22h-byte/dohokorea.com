<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANATEX DDA — DOHO Korea</title>
<meta name="description" content="HANATEX DDA by DOHO Korea — Indigo Denim Color Discharge Agent.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f2233; --gold:#e5b54e; --blue-dark:#2e5878; --text:#1e3040; --line:rgba(255,255,255,.15); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--navy); font-family:'Montserrat',sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  .bar { flex:0 0 auto; display:flex; align-items:center; gap:.6rem; padding:.55rem 16px; background:#fff; border-bottom:3px solid var(--gold); box-shadow:0 2px 10px rgba(0,0,0,.12); z-index:2; }
  .back { display:flex; align-items:center; gap:.55rem; text-decoration:none; color:var(--blue-dark); font-weight:800; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  .back img { height:34px; }
  .back b { font-size:1rem; }
  .crumb { flex:1; min-width:0; font-size:.72rem; color:#6a8898; font-weight:700; letter-spacing:.06em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumb strong { color:var(--text); }
  .btn { flex:0 0 auto; border:none; cursor:pointer; text-decoration:none; font-family:inherit; font-weight:800; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; padding:.62rem .9rem; border-radius:4px; white-space:nowrap; }
  .btn.gold { background:var(--gold); color:var(--navy); }
  .btn.line { background:#fff; color:var(--blue-dark); border:1.5px solid rgba(46,88,120,.35); }
  .frame-wrap { position:relative; flex:1 1 auto; background:#f4f8f9; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(15,34,51,.9); color:#fff; font-size:.72rem; padding:.55rem .9rem; border-radius:20px; white-space:nowrap; }
  .hint a { color:var(--gold); font-weight:800; }
  .hint button { background:none; border:none; color:rgba(255,255,255,.6); margin-left:.5rem; cursor:pointer; font-size:.8rem; }

  /* inquiry modal */
  .modal { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(14,28,40,.62); }
  .modal.open { display:flex; }
  .sheet { position:relative; width:100%; max-width:480px; max-height:calc(100vh - 32px); overflow:auto; background:#fff; border-radius:10px; padding:1.6rem 1.5rem 1.4rem; color:var(--text); }
  .sheet h2 { font-size:1.15rem; color:var(--blue-dark); margin-bottom:.25rem; }
  .sheet p.lead { font-size:.78rem; color:#6a8898; margin-bottom:1rem; }
  .x { position:absolute; top:10px; right:12px; width:32px; height:32px; border:none; border-radius:50%; background:#eef3f5; cursor:pointer; font-size:1rem; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  .fg { display:flex; flex-direction:column; gap:.3rem; margin-bottom:.7rem; }
  label { font-size:.62rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-dark); }
  input, textarea { border:1.5px solid #e4eef1; border-radius:3px; padding:.7rem .8rem; font-family:inherit; font-size:.88rem; color:var(--text); background:#f4f8f9; outline:none; width:100%; }
  input:focus, textarea:focus { border-color:#5a90b0; background:#fff; }
  textarea { min-height:110px; resize:vertical; }
  .send { width:100%; background:var(--blue-dark); color:#fff; padding:.95rem; border:none; border-radius:3px; font-family:inherit; font-weight:800; font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
  .send:disabled { opacity:.6; cursor:wait; }
  .inq-status { margin-top:.8rem; padding:.75rem .9rem; border-radius:3px; font-size:.8rem; line-height:1.5; }
  .inq-status.ok { background:#d1fae5; color:#065f46; border:1px solid #34d399; }
  .inq-status.err { background:#fee2e2; color:#991b1b; border:1px solid #f87171; }

  @media (max-width:640px) {
    .crumb, .back span, .btn.line .full { display:none; }
    .bar { gap:.4rem; }
    .btn { padding:.55rem .65rem; }
    .row { grid-template-columns:1fr; gap:0; }
    .hint { font-size:.66rem; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="back" href="/" title="Back to DOHO Korea homepage"><b>←</b><img src="doho-logo.png" alt="DOHO Korea"><span>Home</span></a>
    <div class="crumb">DOHO Korea / Products / <strong>HANATEX DDA</strong></div>
    <a class="btn line" href="https://hanatexdda-kvqnmdyg.manus.space/" target="_blank" rel="noopener">↗<span class="full"> Full screen</span></a>
    <button class="btn gold" onclick="openInq()">Email Inquiry</button>
  </header>

  <main class="frame-wrap">
    <iframe src="https://hanatexdda-kvqnmdyg.manus.space/" title="HANATEX DDA product site" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="hint" id="hint">Page not loading? <a href="https://hanatexdda-kvqnmdyg.manus.space/" target="_blank" rel="noopener">Open HANATEX DDA ↗</a><button onclick="this.parentNode.remove()" aria-label="Dismiss">✕</button></div>
  </main>

  <div class="modal" id="inq" role="dialog" aria-modal="true" aria-labelledby="inqTitle" onclick="if(event.target===this)closeInq()">
    <div class="sheet">
      <button class="x" onclick="closeInq()" aria-label="Close">✕</button>
      <h2 id="inqTitle">HANATEX DDA Inquiry</h2>
      <p class="lead">Samples, TDS/SDS, pricing or distribution — we reply from overseas@dohokorea.com.</p>
      <form onsubmit="event.preventDefault(); dohoSendInquiry(this, 'dohokorea.com/dda.html');" novalidate>
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <div class="row">
          <div class="fg"><label>Full Name *</label><input name="name" required placeholder="John Smith"></div>
          <div class="fg"><label>Company</label><input name="company" placeholder="Your Company"></div>
        </div>
        <div class="fg"><label>Email Address *</label><input type="email" name="email" required placeholder="john@company.com"></div>
        <div class="row">
          <div class="fg"><label>Country / Market</label><input name="country" placeholder="e.g. Indonesia"></div>
          <div class="fg"><label>Product</label><input name="product" value="HANATEX DDA" data-fixed="1"></div>
        </div>
        <div class="fg"><label>Message *</label><textarea name="message" required placeholder="Fabric type, target effect, monthly quantity, sample request…"></textarea></div>
        <button type="submit" class="send">Send Inquiry</button>
        <div class="inq-status" style="display:none"></div>
      </form>
    </div>
  </div>

<script src="inquiry.js"></script>
<script>
  function openInq(){ document.getElementById('inq').classList.add('open'); }
  function closeInq(){ document.getElementById('inq').classList.remove('open'); }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeInq(); });
  setTimeout(function(){ var h=document.getElementById('hint'); if(h) h.style.opacity='.85'; }, 4000);
</script>
</body>
</html>
